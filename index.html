<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <title>Raz阅读器</title>
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect rx='20' width='100' height='100' fill='%234a6fa5'/><text x='50' y='72' font-size='60' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>R</text></svg>">
<link rel="stylesheet" href="styles.css">

</head>

<body>
  <!-- Key Verification Overlay -->
  <div class="key-overlay" id="keyOverlay">
    <!-- Page 1: Preview books (shown first) -->
    <div class="key-page" id="keyPage1">
    <div class="preview-section" id="previewSection">
      <h3>试读精选</h3>
      <div class="preview-sub">免费体验部分书籍，解锁后可阅读全部</div>
      <div class="carousel-wrap" id="carouselWrap">
        <div class="carousel-track" id="carouselTrack"></div>
      </div>
      <div class="carousel-dots" id="carouselDots"></div>
    </div>
    <!-- Scroll hint -->
    <div class="scroll-hint" id="scrollHint">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
      向下滚动，解锁全部书籍
    </div>
    </div><!-- /key-page1 -->
    <!-- Page 2: Verification -->
    <div class="key-page" id="keyPage2">
    <div class="key-card">
      <h2>访问验证</h2>
      <div class="key-sub">请输入访问密钥以继续阅读</div>
      <div class="device-section">
        <div class="device-label">本机设备码</div>
        <div class="device-value" id="deviceCodeDisplay">--------</div>
      </div>
      <input class="key-input" id="keyInput" type="text" maxlength="8" placeholder="请输入8位密钥" autocomplete="off"
        spellcheck="false" oninput="this.value=this.value.toUpperCase().replace(/[^A-Z0-9]/g,'')">
      <div class="key-error" id="keyError"></div>
      <button class="key-submit" onclick="submitKey()">验证</button>
      <div style="margin-top:16px;text-align:center">
        <img id="qrCodeImg"
          src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAZAAAAGQAQMAAAC6caSPAAAABlBMVEX///8AAABVwtN+AAAACXBIWXMAAA7EAAAOxAGVKw4bAAACG0lEQVR4nO3cO27DMAwGYAYdMvYIOYqPZh8tR/ERMnYIzJoPUZTboRmMMsDPpYakzxMtUI+U6PWYucciDdNGV15pfmo3f9GNl480aAMBOZ88W4Jq10OIPO/xGNpbGoOAVCWf0q9J7s2a/EZa8u+vklErCMg7EJ2u0zQ+sb0DBOQfCe3PdxkTz39IfhCQIsTDk/9+YY9xTvYAASlKuEerk30az8nfAwSkJDmET+k9rvKq4ygQkHNJy2TJWA2dk9eoOviY1SAgpQnHKs/mZPKa2TclJCzzNxCQisTCauNeXWjoKk8/CvsQaAgQkPOIb51pRTH7OUUqeimWdRybFSAgBQlRqyLYk3w8ffP5WYI5nkFAyhHdRrM2216LLTVp5xQ2ZgMBqUhm7RoLkuPU3fmqCgTkZEL5PMKXb7lda+aok626AAEpSCQmbsnvCU9RJ6dNCe4FCQhINTLHOTINd3gon7hZ2EpwAwEpSjzJOS605xUf2S6cxjWSHwTkfMJ+pUEGttO3cSMiX0UDAalK9mH9OGNrXTHMw2rmDQSkIhki18ncnn2VN3kDCMj5pHVJLGlTIm9ELLkYJhCQkiTfTte/F03+gcjDFFtqICA1Sf7tW9znWeJU7ta+jcZBQN6E6Iov3+2xr8Paf/zwEwTkfNLC+KG6+D2TQUBKEI9O8jUzX/H114KA1CTcY8n/8MHbdB/DP5DfF4kgIBXI6/ENowsLuI0aPi0AAAAASUVORK5CYII="
          alt="QR" style="width:140px;height:140px;border-radius:8px;display:inline-block">
        <div style="font-size:14px;color:#999;margin-top:6px">获取密钥请<strong>微信扫码</strong>添加小助手</div>
      </div>
    </div>
    </div><!-- /key-page2 -->
  </div>
  <div class="name-overlay" id="nameOverlay">
    <div class="name-card">
      <h2>欢迎！</h2>
      <div class="name-sub">请输入你的名字，个性化你的阅读器</div>
      <input class="name-input" id="nameInput" type="text" maxlength="20" placeholder="你的名字" autocomplete="off"
        spellcheck="false">
      <button class="name-submit" onclick="submitName()">开始阅读</button>
    </div>
  </div>

  <div class="container" id="mainContainer" style="display:none">
    <div class="header">
      <h1 id="mainTitle">Raz阅读器</h1>
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <div class="stats" id="stats"></div>
        <div class="nav-actions">
          <button class="nav-btn" id="btn-profile" onclick="showProfileOverlay()" title="我的">
            <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
          </button>
          <button class="nav-btn" id="btn-theme" onclick="showThemeDialog()" title="更换主题">
            <svg viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9c.83 0 1.5-.67 1.5-1.5 0-.39-.15-.74-.39-1.01-.23-.26-.38-.61-.38-1 0-.83.67-1.5 1.5-1.5H16c2.76 0 5-2.24 5-5 0-4.42-4.03-8-9-8zm-5.5 9c-.83 0-1.5-.67-1.5-1.5S5.67 9 6.5 9 8 9.67 8 10.5 7.33 12 6.5 12zm3-4C8.67 8 8 7.33 8 6.5S8.67 5 9.5 5s1.5.67 1.5 1.5S10.33 8 9.5 8zm5 0c-.83 0-1.5-.67-1.5-1.5S13.67 5 14.5 5s1.5.67 1.5 1.5S15.33 8 14.5 8zm3 4c-.83 0-1.5-.67-1.5-1.5S16.67 9 17.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
          </button>
        </div>
      </div>
    </div>
    <div class="search-row">
      <input type="text" id="searchInput" placeholder="搜索书名..." oninput="handleSearch(this.value)">
    </div>
    <div class="sort-row">
      <span style="font-size:12px;color:var(--text2)">排序：</span>
      <button class="sort-btn active" id="sortAsc" onclick="setSortOrder('asc')">正序 aa→Z2</button>
      <button class="sort-btn" id="sortDesc" onclick="setSortOrder('desc')">倒序 Z2→aa</button>
    </div>
    <div class="level-tabs" id="levelTabs"></div>
    <div class="grid" id="bookGrid"></div>
  </div>
  <div class="reader-overlay" id="reader">
    <div class="reader-top">
      <button onclick="closeReader()">←</button>
      <span class="book-title" id="readerTitle"></span>
      <span class="page-info" id="pageInfo">1 / 1</span>
      <button onclick="toggleAutoPlay()" id="autoPlayBtn">▶ 自动</button>
    </div>
    <div class="progress-bar">
      <div class="fill" id="progressFill"></div>
    </div>
    <div class="reader-main" id="readerMain">
      <div class="reader-scroll" id="readerScroll"></div>
      <div class="reader-nav prev" onclick="prevPage()"></div>
      <div class="reader-nav next" onclick="nextPage()"></div>
      <!-- Reading Limit Overlay -->
      <div class="limit-overlay" id="limitOverlay">
        <div class="limit-card">
          <h2>试读结束</h2>
          <div class="limit-sub">你已阅读完试读部分，输入密钥即可解锁全部书籍</div>
          <div class="device-section">
            <div class="device-label">本机设备码</div>
            <div class="device-value" id="limitDeviceCode">--------</div>
          </div>
          <input class="key-input" id="limitKeyInput" type="text" maxlength="8" placeholder="请输入8位密钥" autocomplete="off"
            spellcheck="false" oninput="this.value=this.value.toUpperCase().replace(/[^A-Z0-9]/g,'')">
          <div class="key-error" id="limitKeyError"></div>
          <button class="key-submit" onclick="submitLimitKey()">验证</button>
          <div style="margin-top:16px;text-align:center">
            <img id="limitQrImg" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAZAAAAGQAQMAAAC6caSPAAAABlBMVEX///8AAABVwtN+AAAACXBIWXMAAA7EAAAOxAGVKw4bAAACG0lEQVR4nO3cO27DMAwGYAYdMvYIOYqPZh8tR/ERMnYIzJoPUZTboRmMMsDPpYakzxMtUI+U6PWYucciDdNGV15pfmo3f9GNl480aAMBOZ88W4Jq10OIPO/xGNpbGoOAVCWf0q9J7s2a/EZa8u+vklErCMg7EJ2u0zQ+sb0DBOQfCe3PdxkTz39IfhCQIsTDk/9+YY9xTvYAASlKuEerk30az8nfAwSkJDmET+k9rvKq4ygQkHNJy2TJWA2dk9eoOviY1SAgpQnHKs/mZPKa2TclJCzzNxCQisTCauNeXWjoKk8/CvsQaAgQkPOIb51pRTH7OUUqeimWdRybFSAgBQlRqyLYk3w8ffP5WYI5nkFAyhHdRrM2216LLTVp5xQ2ZgMBqUhm7RoLkuPU3fmqCgTkZEL5PMKXb7lda+aok626AAEpSCQmbsnvCU9RJ6dNCe4FCQhINTLHOTINd3gon7hZ2EpwAwEpSjzJOS605xUf2S6cxjWSHwTkfMJ+pUEGttO3cSMiX0UDAalK9mH9OGNrXTHMw2rmDQSkIhki18ncnn2VN3kDCMj5pHVJLGlTIm9ELLkYJhCQkiTfTte/F03+gcjDFFtqICA1Sf7tW9znWeJU7ta+jcZBQN6E6Iov3+2xr8Paf/zwEwTkfNLC+KG6+D2TQUBKEI9O8jUzX/H114KA1CTcY8n/8MHbdB/DP5DfF4kgIBXI6/ENowsLuI0aPi0AAAAASUVORK5CYII=" alt="QR" style="width:140px;height:140px;border-radius:8px;display:inline-block">
            <div style="font-size:14px;color:#999;margin-top:6px">获取密钥请<strong>微信扫码</strong>添加小助手</div>
          </div>
          <button class="limit-close" onclick="hideLimitOverlay()">返回试读</button>
        </div>
      </div>
    </div>
    <div class="reader-bottom">
      <div class="audio-bar" id="audioBar">
        <button onclick="toggleAudio()" id="playBtn">🔇</button>
        <span class="time" id="curTime">0:00</span>
        <input type="range" id="seekBar" min="0" max="100" value="0" oninput="seekAudio(this.value)">
        <span class="time" id="durTime">0:00</span>
        <button onclick="toggleMute()" id="volBtn">🔊</button>
      </div>
      <button class="ctrl-btn" onclick="prevPage()">◀ 上一页</button>
      <button class="ctrl-btn" onclick="nextPage()">下一页 ▶</button>
    </div>
  </div>
  <div class="celebration" id="celebration">
    <div class="content">
      <div class="emoji">🏆</div>
      <div class="msg">恭喜你！</div>
      <div class="sub" id="celebBook"></div>
      <div class="celeb-actions" id="celebActions">
        <button class="celeb-btn celeb-quiz" id="celebQuizBtn" onclick="openQuiz()" style="display:none">做Quiz</button>
        <button class="celeb-btn" onclick="closeCelebration()">继续阅读</button>
      </div>
    </div>
  </div>
  <!-- Quiz Overlay -->
  <div class="quiz-overlay" id="quizOverlay">
    <div class="quiz-container">
      <div class="quiz-header">
        <button class="quiz-back" onclick="closeQuiz()">&larr;</button>
        <span class="quiz-title" id="quizTitle"></span>
      </div>
      <div class="quiz-nav" id="quizNav"></div>
      <div class="quiz-summary" id="quizSummary" style="display:none"></div>
      <div class="quiz-warning" id="quizWarning" style="display:none"></div>
      <div class="quiz-body" id="quizBody"></div>
      <div class="quiz-footer">
        <button class="quiz-nav-btn" id="quizPrev" onclick="quizPrevQ()">&#9664; 上一题</button>
        <button class="quiz-submit-btn" id="quizSubmit" onclick="submitQuiz()" style="display:none">提交</button>
        <button class="quiz-redo-btn" id="quizRedo" onclick="submitRedo()" style="display:none">提交重做</button>
        <button class="quiz-back-btn" id="quizBackShelf" onclick="quizBackToShelf()" style="display:none">返回书架</button>
        <button class="quiz-nav-btn" id="quizNext" onclick="quizNextQ()">下一题 &#9654;</button>
      </div>
    </div>
  </div>
  <!-- Profile Overlay -->
  <div class="profile-overlay" id="profileOverlay" onclick="if(event.target===this)hideProfileOverlay()">
    <div class="profile-content">
      <div class="profile-header">
        <button class="profile-back" onclick="hideProfileOverlay()">&larr;</button>
        <h2>我的</h2>
      </div>
      <div class="profile-body" id="profileBody"></div>
    </div>
  </div>
  <!-- Theme Dialog -->
  <div class="theme-dialog-overlay" id="themeDialogOverlay" onclick="if(event.target===this)hideThemeDialog()">
    <div class="theme-dialog">
      <h3>选择配色方案</h3>
      <div class="theme-options" id="themeOptions"></div>
    </div>
  </div>
  <!-- Achievement Overlay -->
<script src="verify.js"></script>

  <div class="ach-overlay" id="achOverlay" onclick="if(event.target===this)hideAchOverlay()">
    <div class="ach-content">
      <div class="ach-header">
        <h2>我的成就</h2>
        <button class="ach-close" onclick="hideAchOverlay()">&times;</button>
      </div>
      <div class="ach-summary" id="achSummary"></div>
      <div id="achSections"></div>
    </div>
  </div>
  <!-- Init Confirm Overlay -->
  <div class="init-overlay" id="initOverlay" onclick="if(event.target===this)hideInitConfirm()">
    <div class="init-card">
      <h3>重置阅读器</h3>
      <div class="init-msg">确定要重置阅读器吗？</div>
      <div class="init-warn">将清空所有阅读记录、成就和访问密钥，重置后需重新输入密钥。</div>
      <div class="init-btns">
        <button class="init-btn init-cancel" onclick="hideInitConfirm()">取消</button>
        <button class="init-btn init-confirm" onclick="doReset()">确认重置</button>
      </div>
    </div>
  </div>
<script src="book-data.js"></script>
<script src="quiz-data.min.js"></script>
<script src="app.js"></script>
</body>

</html>
