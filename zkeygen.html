<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raz Key Generator</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f172a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#e2e8f0}
.card{background:#1e293b;border-radius:16px;padding:40px;width:420px;max-width:95vw;box-shadow:0 25px 50px -12px rgba(0,0,0,.5)}
h1{text-align:center;font-size:24px;margin-bottom:8px;background:linear-gradient(135deg,#60a5fa,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.subtitle{text-align:center;color:#94a3b8;font-size:13px;margin-bottom:28px}
.field{margin-bottom:20px}
label{display:block;font-size:13px;color:#94a3b8;margin-bottom:6px;font-weight:500}
input{width:100%;padding:12px 16px;border:2px solid #334155;border-radius:10px;background:#0f172a;color:#f1f5f9;font-size:18px;font-family:'Courier New',monospace;letter-spacing:3px;text-transform:uppercase;outline:none;transition:border-color .2s}
input:focus{border-color:#60a5fa}
input::placeholder{letter-spacing:0;font-size:14px;color:#475569;text-transform:none}
.btn{width:100%;padding:14px;border:none;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;transition:all .2s;margin-top:4px}
.btn-gen{background:linear-gradient(135deg,#3b82f6,#8b5cf6);color:#fff}
.btn-gen:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(59,130,246,.3)}
.btn-gen:active{transform:translateY(0)}
.result{margin-top:24px;padding:20px;background:#0f172a;border-radius:12px;border:1px solid #334155;display:none}
.result.show{display:block}
.result-label{font-size:12px;color:#64748b;margin-bottom:4px;text-transform:uppercase;letter-spacing:1px}
.result-key{font-size:28px;font-family:'Courier New',monospace;letter-spacing:4px;color:#34d399;text-align:center;padding:12px 0;user-select:all;cursor:pointer}
.result-dc{font-size:14px;font-family:'Courier New',monospace;color:#94a3b8;text-align:center;margin-top:8px}
.copy-hint{text-align:center;font-size:11px;color:#475569;margin-top:8px}
.history{margin-top:20px;max-height:200px;overflow-y:auto}
.history-title{font-size:12px;color:#64748b;margin-bottom:8px;text-transform:uppercase;letter-spacing:1px}
.history-item{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:#0f172a;border-radius:8px;margin-bottom:4px;font-size:13px;font-family:'Courier New',monospace}
.history-item .dc{color:#94a3b8}
.history-item .key{color:#34d399;cursor:pointer}
.history-item .time{color:#475569;font-size:11px;font-family:-apple-system,sans-serif}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#34d399;color:#0f172a;padding:10px 24px;border-radius:8px;font-size:14px;font-weight:600;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.batch{margin-top:16px}
.batch label{display:flex;align-items:center;gap:8px;cursor:pointer}
.batch input[type=checkbox]{width:16px;height:16px;accent-color:#3b82f6}
</style>
</head>
<body>
<div class="card">
  <h1>Raz Key Generator</h1>
  <div class="subtitle">输入设备码，生成8位访问密钥</div>
  <div class="field">
    <label>设备码 (8位)</label>
    <input id="dcInput" type="text" maxlength="8" placeholder="输入设备码" autocomplete="off" spellcheck="false"
      oninput="this.value=this.value.toUpperCase().replace(/[^A-Z0-9]/g,'')">
  </div>
  <button class="btn btn-gen" onclick="generate()">生成密钥</button>
  <div class="result" id="result">
    <div class="result-label">密钥</div>
    <div class="result-key" id="keyOutput" onclick="copyKey()">--------</div>
    <div class="result-dc" id="dcOutput"></div>
    <div class="copy-hint">点击密钥复制</div>
  </div>
  <div class="history" id="history" style="display:none">
    <div class="history-title">历史记录</div>
    <div id="historyList"></div>
  </div>
</div>
<div class="toast" id="toast">已复制到剪贴板</div>
<script>
var CHARS='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
var history=[];

function generateKeyForDevice(dc){
  dc=dc.toUpperCase();
  if(dc.length!==8)return null;
  for(var i=0;i<8;i++){if(CHARS.indexOf(dc[i])===-1)return null}
  var data='';
  for(var i=0;i<6;i++){data+=CHARS[Math.floor(Math.random()*36)]}
  var sumA=0,xorVal=0;
  for(var i=0;i<6;i++){
    var idx=CHARS.indexOf(data[i]);
    sumA+=idx*(i+3);
    xorVal^=(idx*7+i*13)&0xFF;
  }
  var checkA=sumA%36;
  var dcSum=0;
  for(var j=0;j<dc.length;j++){dcSum+=dc.charCodeAt(j)*(j+1)}
  var checkB=(xorVal^(dcSum&0xFF))%36;
  if(checkB<0)checkB+=36;
  return data+CHARS[checkA]+CHARS[checkB];
}

function validateKey(key,dc){
  if(!key||key.length!==8)return false;
  for(var i=0;i<8;i++){if(CHARS.indexOf(key[i])===-1)return false}
  var sumA=0,xorVal=0;
  for(var i=0;i<6;i++){
    var idx=CHARS.indexOf(key[i]);
    sumA+=idx*(i+3);
    xorVal^=(idx*7+i*13)&0xFF;
  }
  var checkA=sumA%36;
  var dcSum=0;
  for(var j=0;j<dc.length;j++){dcSum+=dc.charCodeAt(j)*(j+1)}
  var checkB=(xorVal^(dcSum&0xFF))%36;
  if(checkB<0)checkB+=36;
  return key[6]===CHARS[checkA]&&key[7]===CHARS[checkB];
}

function generate(){
  var dc=document.getElementById('dcInput').value.toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(dc.length!==8){
    document.getElementById('dcInput').style.borderColor='#ef4444';
    setTimeout(function(){document.getElementById('dcInput').style.borderColor=''},1500);
    return;
  }
  var key=generateKeyForDevice(dc);
  if(!key)return;
  var valid=validateKey(key,dc);
  document.getElementById('keyOutput').textContent=key;
  document.getElementById('dcOutput').textContent='设备码: '+dc+(valid?' ✓':' ✗ 验证失败');
  document.getElementById('result').classList.add('show');
  // Auto copy to clipboard
  copyText(key);
  // Add to history
  var now=new Date();
  var timeStr=now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0')+':'+now.getSeconds().toString().padStart(2,'0');
  history.unshift({dc:dc,key:key,time:timeStr,valid:valid});
  if(history.length>20)history.pop();
  renderHistory();
}

function renderHistory(){
  if(history.length===0)return;
  document.getElementById('history').style.display='block';
  var html='';
  for(var i=0;i<history.length;i++){
    var h=history[i];
    html+='<div class="history-item"><span class="dc">'+h.dc+'</span><span class="key" onclick="copyText(\''+h.key+'\')">'+h.key+'</span><span class="time">'+h.time+'</span></div>';
  }
  document.getElementById('historyList').innerHTML=html;
}

function copyKey(){
  var key=document.getElementById('keyOutput').textContent;
  if(key==='--------')return;
  copyText(key);
}

function copyText(text){
  navigator.clipboard.writeText(text).then(function(){
    showToast('已复制: '+text);
  }).catch(function(){
    // Fallback
    var ta=document.createElement('textarea');
    ta.value=text;document.body.appendChild(ta);ta.select();
    document.execCommand('copy');document.body.removeChild(ta);
    showToast('已复制: '+text);
  });
}

function showToast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(function(){t.classList.remove('show')},1500);
}

// Auto-focus input on load
document.getElementById('dcInput').focus();
// Auto-generate when 8 chars entered
document.getElementById('dcInput').addEventListener('input',function(){
  var v=this.value.toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(v.length===8)generate();
});
// Enter key also generates
document.getElementById('dcInput').addEventListener('keydown',function(e){
  if(e.key==='Enter')generate();
});
</script>
</body>
</html>
